apiVersion: v1
kind: Pod
metadata:
  name: task-pv-pod
spec:
  containers:
  - args:
    - while true; do sleep 10; done;
    command:
    - /bin/sh
    - -c
    - --
    image: registry.local:9001/ps_emea/centos:latest
    name: task-pv-container
    volumeMounts:
    - mountPath: /usr/share/
      name: task-pv-storage
  imagePullSecrets:
  - name: registry-creds
  nodeName: controller-0
  volumes:
  - name: task-pv-storage
    persistentVolumeClaim:
      claimName: task-pv-claim
