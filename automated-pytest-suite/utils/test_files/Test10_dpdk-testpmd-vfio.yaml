apiVersion: "k8s.cni.cncf.io/v1" 
kind: NetworkAttachmentDefinition 
metadata: 
  name: sriov-data-testpmd-5 
  annotations: 
    k8s.v1.cni.cncf.io/resourceName: intel.com/pci_sriov_net_physnet5 
spec: 
  config: '{ 
  "type": "sriov", 
  "name": "sriov-data-testpmd-5" 
}' 
--- 
 
apiVersion: v1 
kind: Pod 
metadata: 
  name: dpdk-testpmd 
  annotations: 
    k8s.v1.cni.cncf.io/networks: '[ 
       {"name": "sriov-data-testpmd-5"} 
    ]' 
spec: 
  restartPolicy: Never 
  containers: 
  - name: dpdk-pktgen 
    image: windse/dpdk-pktgen:d1911r4p1912 
    imagePullPolicy: IfNotPresent 
    volumeMounts: 
    - mountPath: /mnt/huge-2048 
      name: hugepage 
    - name: lib-modules 
      mountPath: /lib/modules 
    - name: src 
      mountPath: /usr/src 
    command: ["/bin/bash", "-ec", "sleep infinity"] 
    securityContext: 
      privileged: false 
      capabilities: 
        add: 
          ["IPC_LOCK", "SYS_ADMIN"] 
    resources: 
      requests: 
        memory: 8Gi 
        hugepages-1Gi: 4Gi 
        intel.com/pci_sriov_net_physnet5: '1' 
        windriver.com/isolcpus: 4 
      limits: 
        memory: 8Gi 
        hugepages-1Gi: 4Gi 
        intel.com/pci_sriov_net_physnet5: '1' 
        windriver.com/isolcpus: 4 
  volumes: 
  - name: hugepage 
    emptyDir: 
        medium: HugePages 
  - name: lib-modules 
    hostPath: 
      path: /lib/modules 
  - name: src 
    hostPath: 
      path: /usr/src 
