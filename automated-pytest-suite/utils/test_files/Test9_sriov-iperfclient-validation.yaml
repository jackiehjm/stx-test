      { "name": "srif0net1" } 
    ]' 
spec: 
  containers: 
  - name: client 
    image: centos/tools 
    imagePullPolicy: IfNotPresent 
    command: [ "/bin/bash", "-c", "--" ] 
    args: [ "while true; do sleep 300000; done;" ] 
    resources: 
      requests: 
        intel.com/pci_sriov_net_physnet1: '1' 
      limits: 
        intel.com/pci_sriov_net_physnet1: '1' 
