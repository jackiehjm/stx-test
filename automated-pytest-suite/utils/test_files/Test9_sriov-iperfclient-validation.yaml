spec: 
  config: '{ 
      "cniVersion": "0.3.0", 
      "type": "sriov", 
      "ipam": { 
         "type": "static", 
         "addresses": [{ 
            "address": "100.56.217.111/24", 
            "gateway": "100.56.217.1" 
          }], 
         "routes": [{ 
            "dst": "0.0.0.0/0" 
         }] 
      } 
  }' 
--- 
apiVersion: v1 
kind: Pod 
metadata: 
