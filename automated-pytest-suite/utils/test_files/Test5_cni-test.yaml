apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: cni-test 
  labels: 
    app: busybox 
spec: 
  replicas: 3 
  strategy: 
    type: RollingUpdate 
  selector: 
    matchLabels: 
      app: busybox 
  template: 
    metadata: 
      labels: 
        app: busybox 
    spec: 
      containers: 
      - name: pingtest 
        image: busybox 
        imagePullPolicy: IfNotPresent 
        command: ['sh', '-c', 'echo Container 1 is Running ; sleep 3600']
