apiVersion: v1
kind: Pod
metadata:
  labels:
    client: acc-test
  name: acc-test
  namespace: default
spec:
  containers:
  - args:
    - sleep 60m
    command:
    - /bin/sh
    - -c
    image: registry.central:9001/ps_emea/centos:latest
    imagePullPolicy: IfNotPresent
    name: acc-test
    resources:
      limits:
        intel.com/intel_acc100_fec: 1
      requests:
        intel.com/intel_acc100_fec: 1
  imagePullSecrets:
  - name: registry-creds
  nodeName: controller-0
  restartPolicy: Always
