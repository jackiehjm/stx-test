apiVersion: v1
kind: Pod
metadata:
  name: cyclictest
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kube-cpu-mgr-policy
            operator: In
            values:
            - static
  containers:
  - command:
    - /bin/bash
    - -ec
    - sleep infinity
    image: windse/wrcp-eval:v0.1.0
    imagePullPolicy: IfNotPresent
    name: cyclictest
    resources:
      limits:
        memory: 1Gi
        windriver.com/isolcpus: 18
      requests:
        memory: 1Gi
        windriver.com/isolcpus: 18
    securityContext:
      capabilities:
        add:
        - SYS_NICE
        - IPC_LOCK
      privileged: true
  nodeName: controller-0
