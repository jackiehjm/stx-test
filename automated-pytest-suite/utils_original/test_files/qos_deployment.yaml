apiVersion: v1
kind: Namespace
metadata:
  name: qos
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-pod-1
  namespace: qos
spec:
  containers:
  - name: qos-demo-ctr
    image: registry.central:9001:/ps_emea/nginx:latest
    resources:
      limits:
        memory: "200Mi"
        cpu: "700m"
      requests:
        memory: "200Mi"
        cpu: "700m"
  imagePullSecrets:
   - name: registry-certs

---
apiVersion: v1
kind: Pod
metadata:
  name: qos-pod-2
  namespace: qos
spec:
  containers:
  - name: qos-demo-2-ctr
    image: registry.central:9001:/ps_emea/nginx:latest
    resources:
      limits:
        memory: "200Mi"
      requests:
        memory: "100Mi"
  imagePullSecrets:
   - name: registry-certs

---
apiVersion: v1
kind: Pod
metadata:
  name: qos-pod-3
  namespace: qos
spec:
  containers:
  - name: qos-demo-3-ctr
    image: registry.central:9001:/ps_emea/nginx:latest
  imagePullSecrets:
   - name: registry-certs
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-pod-with-two-containers
  namespace: qos
spec:
  containers:
  - name: qos-demo-4-ctr-1
    image: registry.central:9001:/ps_emea/nginx:latest
    resources:
      requests:
        memory: "200Mi"

  - name: qos-demo-4-ctr-2
    image: registry.central:9001:/ps_emea/redis:latest
  imagePullSecrets:
   - name: registry-creds
