apiVersion: v1
kind: Pod
metadata:
  name: acc-test
  namespace: default
  labels:
    client: acc-test
spec:
  containers:
  - name: acc-test
    image: registry.central:9001/ps_emea/centos:latest
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh","-c"]
    args: ["sleep 60m"]
    resources:
      requests:
        intel.com/intel_acc100_fec: 1
      limits:
        intel.com/intel_acc100_fec: 1
  restartPolicy: Always
  imagePullSecrets:
   - name: registry-creds
  nodeName: worker-99
