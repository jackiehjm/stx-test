apiVersion: v1
kind: Pod
metadata:
  name: acc-test
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
       {"name": "mf-vfio"}
    ]'
spec:
  restartPolicy: Never
  imagePullSecrets:
   - name: registry-creds
  containers:
  - name: acc-test
    image: registry.central:9001/ps_emea/centos:latest
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - mountPath: /mnt/huge-2048
      name: hugepage
    - name: lib-modules
      mountPath: /lib/modules
    - name: src
      mountPath: /usr/src
    command: ['sh','-c']
    args: ['while true;do sleep 10;done;']
    securityContext:
      privileged: false
      capabilities:
        add:
          ["IPC_LOCK", "SYS_ADMIN"]
    resources:
      requests:
        memory: 4Gi
        hugepages-1Gi: 4Gi
        intel.com/pci_sriov_net_fh1: '1'
        windriver.com/isolcpus: 2
        intel.com/intel_acc100_fec: 1
      limits:
        memory: 4Gi
        hugepages-1Gi: 4Gi
        intel.com/pci_sriov_net_fh1: '1'
        windriver.com/isolcpus: 2
        intel.com/intel_acc100_fec: 1
  volumes:
  - name: hugepage
    emptyDir:
        medium: HugePages
  - name: lib-modules
    hostPath:
      path: /lib/modules
  - name: src
    hostPath:
      path: /usr/src


