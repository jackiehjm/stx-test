apiVersion: v1
kind: Pod
metadata:
  name: client-pod
  namespace: default
  labels:
    client: pod-to-pod
spec:
  containers:
  - image: registry.central:9001/ps_emea/wind-test:latest
    command: ["/bin/sh","-c"]
    args: ["sleep 60m"]
    imagePullPolicy: IfNotPresent
    name: client-container
  restartPolicy: Always
  imagePullSecrets:
   - name: registry-creds
