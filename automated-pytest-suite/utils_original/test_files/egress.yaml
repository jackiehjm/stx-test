---
apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-bmc
spec:
  types:
    - Egress
  egress:
    - action: Deny
      destination:
        nets:
        - 192.168.110.0/24
    - action: Allow
      destination:
        nets:
          - 0.0.0.0/0
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod1
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
   - name: test-pod
     image: registry.central:9001/ps_emea/centos:latest
     command: ["/bin/sh","-c", "--"]
     args: ["while true; do sleep 10; done;"]
